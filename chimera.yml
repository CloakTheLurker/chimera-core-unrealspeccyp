name: chimera-core-unrealspeccyp CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: gate the package
        run: ./waterbox/build-package.sh -r ~/chimera
      - uses: actions/upload-artifact@v4
        with:
          name: unrealspeccyp-${{ github.sha }}
          path: dist/
  publish:
    needs: gate
    if: github.ref == 'refs/heads/main'
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
