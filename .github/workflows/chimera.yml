# Unofficial core: build, core gate and Chimera's package contract test. No
# publish job and no daily schedule — an unofficial core is not in Chimera's
# official-cores.json and publishes nowhere on its own. A release is cut by
# hand from a green run's artifact (see "Publishing" in README.md).
#
# What a runner proves here: the native reference and the sandbox agree (the
# core gate, with distributable test content), and Chimera's package contract
# test opens the package. The ROM/game matrix stays local (ROMs/ and games are
# not distributable). The window test, waterbox/tests/run-frontend.sh, still
# drives the old .NET frontend and is not run until it is ported to the Qt
# window; nothing here claims otherwise.
name: chimera-core-unrealspeccyp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out Chimera
        uses: actions/checkout@v4
        with:
          repository: ToolAssisted-run/chimera
          path: chimera
          submodules: recursive
          fetch-depth: 1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (engine, runner, window, contract test)
        # Installs the system packages, then Qt 6.12 from Qt's archives, then
        # builds the engine, chimera-run, the window and test-packages.
        run: chimera/tools/ci-chimera.sh "$HOME/qt"

      - name: Build miniBox (host runtime and guest C++ toolchain)
        # The guest link uses meson-cpp (its sysroot and libstdc++); the guest
        # legs link run-wbx against the host runtime in meson-linux.
        run: |
          mb="$PWD/chimera/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] \
            || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] \
            || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Gate the core and build the package
        # Everything the core's gate runs: native, guest, m0-m6. The window
        # test is not part of it yet (see the header).
        run: ./waterbox/build-package.sh -r chimera

      - name: Chimera's contract test against the package
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/dist
        run: chimera/build/meson-linux/source/ui/test-packages

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: unrealspeccyp-${{ github.sha }}
          path: dist/*.chimeraCore
          if-no-files-found: error

      - name: Upload the build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/guest/*.log
            build/native/*.log
          if-no-files-found: ignore
